<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Launch Check tile</title>
<style>
@font-face { font-family: 'Instrument Sans'; src: url('../src/assets/fonts/instrument-sans-latin-wght-normal.woff2') format('woff2'); font-weight: 400 700; }
html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
body { background: #1a212b; color: #f6f3ec; font-family: 'Instrument Sans', sans-serif; padding: 34px 36px; box-sizing: border-box; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 16px; }
.stamp { width: 64px; height: 64px; display: grid; place-items: center; font-size: 40px; font-weight: 700; color: #ff8a78; border: 2.5px solid currentColor; border-radius: 8px; box-shadow: inset 0 0 0 3px #1a212b, inset 0 0 0 4px currentColor; transform: rotate(-4deg); }
.name { font-size: 34px; font-weight: 680; letter-spacing: -0.03em; }
p { font-size: 19px; line-height: 1.35; color: #c9c4b8; margin: 20px 0 0; }
.strip { display: flex; gap: 4px; margin-top: auto; height: 12px; }
.strip i { flex: 1; border-radius: 2px; background: #7ccf98; opacity: .6; }
.strip i.f { background: #ff8a78; opacity: 1; } .strip i.w { background: #f0b75a; opacity: 1; }
</style></head>
<body>
<div class="top"><div class="stamp">F</div><div class="name">Launch Check</div></div>
<p>Pre-launch check for the tab you are building, with a leaked-key scan of its scripts.</p>
<div class="strip"><i class="f"></i><i class="f"></i><i class="w"></i><i></i><i class="w"></i><i></i><i class="f"></i><i></i><i></i><i class="w"></i><i></i><i></i><i></i><i class="w"></i><i></i><i></i><i></i><i></i><i class="f"></i><i></i><i></i><i></i></div>
</body></html>
